<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Django Playground" />
    <meta name="keywords" content="Django, Playground" />
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- 可替換title -->
    <title>
      {% block title %}
        <!-- 預設title -->
        Django 大冒險
      {% endblock title %}
    </title>
    <!-- 可替換head -->
    {% block extra_head %}
    {% endblock extra_head %}
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
          <a class="navbar-brand fw-bold fs-4" href="{% url 'blog:article_list' %}">
            🚀 Django 大冒險
          </a>
        </div>
      </nav>
    </header>
    <!-- 可替換main -->
    <main class="flex-grow-1 py-5">
      <div class="container">
        {% block content %}
          <div class="alert alert-info text-center">
            <p class="mb-0">
              目前沒有文章！
            </p>
          </div>
        {% endblock content %}
      </div>
    </main>
    <!-- 可替換footer -->
    <footer class="bg-light border-top mt-auto py-4">
      <div class="container text-center">
        <p class="text-muted mb-0">
          © 2025 Django Playground - 學習 Django 的遊樂場
        </p>
      </div>
    </footer>
    <!-- 可替換scripts -->
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}
    {% endblock extra_scripts %}
  </body>
</html>
