<div class="card h-100 shadow-sm border-0 hover-shadow transition">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title fw-bold text-dark mb-2">{{ article.title }}</h5>
    
    <p class="card-text text-muted small mb-3">
      <i class="bi bi-person-fill"></i> {{ article.author.name }}
      <span class="ms-2"><i class="bi bi-calendar"></i> {{ article.created_at|date:"m/d" }}</span>
    </p>
    
    <p class="card-text text-secondary flex-grow-1 mb-3">
      {{ article.content|truncatewords:30 }}
    </p>
    
    {% if article.tags.all %}
      <div class="mb-3">
        {% for tag in article.tags.all %}
          <span class="badge bg-light text-dark small">{{ tag.name }}</span>
        {% endfor %}
      </div>
    {% endif %}
    
    <a href="{% url 'article_detail' article.id %}" class="btn btn-sm btn-primary align-self-start">
      閱讀更多 →
    </a>
  </div>
</div>

<style>
  .hover-shadow {
    transition: box-shadow 0.3s ease;
  }
  .card:hover {
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
  }
</style>
