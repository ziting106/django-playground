{% extends "blog/base.html" %}

{% block title %}
    標籤列表 - Django 大冒險
{% endblock title %}

{% block blog_content %}
    <div class="mb-4">
        <h2 class="fw-bold mb-2">
            🏷️ 標籤列表
        </h2>
        <p class="text-muted">
            瀏覽所有文章標籤
        </p>
    </div>

    <div class="row g-3">
        {% for tag in tags %}
            <div class="col-md-6">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title mb-2">
                            <i class="bi bi-tag"></i> {{ tag.name }}
                        </h5>
                        <p class="card-text text-muted">
                            <span class="badge bg-info">{{ tag.articles.count }} 篇文章</span>
                        </p>
                    </div>
                </div>
            </div>
        {% empty %}
            <div class="col-12">
                <div class="alert alert-info text-center" role="alert">
                    <h5 class="alert-heading">
                        沒有標籤
                    </h5>
                    <p class="mb-0">
                        目前還沒有任何標籤。
                    </p>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock blog_content %}
