{% extends "blog/base.html" %}

{% block title %}
  文章列表 - Django 大冒險
{% endblock title %}

{% block blog_content %}
  <div class="mb-4">
    <h2 class="fw-bold mb-2">
      📰 文章列表
    </h2>
    <p class="text-muted">
      發現最新的文章和故事
    </p>
  </div>

  <div class="row g-4">
    {% for article in articles %}
      <div class="col-md-6">
        {% include "blog/components/article_card.html" %}
      </div>
    {% empty %}
      <div class="col-12">
        <div class="alert alert-info text-center" role="alert">
          <h5 class="alert-heading">
            沒有文章
          </h5>
          <p class="mb-0">
            目前還沒有發布任何文章。敬請期待！
          </p>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock blog_content %}
